name: Release

# Builds a universal Tankard.app, signs it with the owner's Developer ID
# (hardened runtime, secure timestamp), notarizes and staples it, and
# attaches Tankard.zip to the GitHub Release for the tag.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CERT_P12_BASE64    base64 of the exported "Developer ID Application" .p12
#   CERT_P12_PASSWORD  that .p12's password
#   NOTARY_APPLE_ID    Apple ID used for notarization
#   NOTARY_TEAM_ID     10-character Team ID
#   NOTARY_PASSWORD    app-specific password from appleid.apple.com
#
# The signing and notarizing steps are Scripts/release.sh, the same script
# the owner can run locally.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v0.2.0)"
        required: true

permissions: {}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write  # create the release and upload Tankard.zip
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check secrets
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          missing=""
          for s in CERT_P12_BASE64 CERT_P12_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions (see docs/architecture.md, 'Signing a release')."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # version = tag; CFBundleVersion = the same string (bundle-app.sh)

      # Fails the release when CHANGELOG.md has no section for the tag, so a
      # release never ships without its list of changes.
      - name: Release notes from CHANGELOG.md
        run: |
          Scripts/changelog-section.sh --self-test
          {
            # Short: Check for Tankard Updates… in 0.8.4 and earlier shows
            # only the first 700 characters of this body.
            echo "Tankard ${TAG} for macOS 14 Sonoma and later."
            echo
            BASE="${TAG#v}"; BASE="${BASE%%-*}"   # v0.3.1-rc1 -> 0.3.1
            Scripts/changelog-section.sh "$BASE"
            echo
            echo "A native Homebrew app, universal (Intel and Apple silicon), signed with Developer ID and notarized."
            echo
            echo 'Install or upgrade: `brew install --cask d4rkwyng/tap/tankard` / `brew upgrade --cask tankard`'
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Tests
        run: swift test

      - name: Build, sign, notarize, staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          V="${TAG#v}"; export TANKARD_VERSION="${V%%-*}"
          ./Scripts/release.sh

      # Apple's notarization answer and log, kept also when the step above
      # failed (an Invalid submission's issues list is in the log). Apple's
      # log has no credentials: id, status, archive name, sha256, cdhashes
      # and the issues. Nothing to upload when the run stopped before
      # notarizing.
      - name: Keep the notarization log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notary-${{ env.TAG }}
          path: |
            dist/notary-result.json
            dist/notary-log.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/Tankard.zip
          body_path: ${{ runner.temp }}/release-notes.md
          # Every tag creates a draft so a final tag is never Latest
          # until we publish it by hand after the VM checks. A suffix
          # (v0.3.1-rc1) is also a prerelease. Notarization is unchanged.
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
